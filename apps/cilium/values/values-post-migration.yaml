upgradeCompatibility: "1.19"

# Apply metric-context ConfigMap changes through GitOps, one agent at a time.
rollOutCiliumPods: true
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

routingMode: tunnel
tunnelProtocol: vxlan
tunnelPort: 8473

cni:
  customConf: false
  uninstall: false

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.245.0.0/16

kubeProxyReplacement: false
policyEnforcementMode: default

bpf:
  hostLegacyRouting: true

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

hubble:
  enabled: true
  metrics:
    enabled:
      # Namespace-only context avoids per-IP/per-pod metric cardinality.
      - dns:query;ignoreAAAA;sourceContext=namespace;destinationContext=namespace;labelsContext=source_namespace,destination_namespace
      - drop:sourceContext=namespace;destinationContext=namespace;labelsContext=source_namespace,destination_namespace
      - tcp:sourceContext=namespace;destinationContext=namespace;labelsContext=source_namespace,destination_namespace
      - flow:sourceContext=namespace;destinationContext=namespace;labelsContext=source_namespace,destination_namespace
      - icmp:sourceContext=namespace;destinationContext=namespace;labelsContext=source_namespace,destination_namespace
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true
      trustCRDsExist: true
    dashboards:
      # Curated copies use distinct UIDs for a safe handoff until pruning.
      # Disabled HTTP/port-distribution metrics are documented, not queried.
      enabled: false
  relay:
    enabled: true
  ui:
    enabled: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true

dashboards:
  enabled: true
  annotations:
    k8s-sidecar-target-directory: /tmp/dashboards/Cilium

operator:
  unmanagedPodWatcher:
    restart: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      trustCRDsExist: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
