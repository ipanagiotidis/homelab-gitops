excludeNamespaces: kube-system,kyverno,trivy-system

automountServiceAccountToken: true

image:
  registry: reg.yiannis.io
  repository: proxy-dockerhub/aquasec/trivy-operator
  tag: 0.32.0@sha256:d4a61c4607e2931bd2615bf3bcf8912669d11d194c44c77edd413e6301b50c5b # 0.32.0

operator:
  scannerReportTTL: 168h
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  exposedSecretScannerEnabled: false
  metricsFindingsEnabled: true

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 15m

policiesBundle:
  registry: reg.yiannis.io
  repository: proxy-dockerhub/aquasec/trivy-checks
  tag: 1@sha256:0491169789b867ae5a7353381220c1d4d97b3a0d6d9dfd84a25d06f0ba68aa93 # 1

trivy:
  severity: HIGH,CRITICAL
  ignoreUnfixed: true
  slow: true
  image:
    registry: reg.yiannis.io
    repository: proxy-dockerhub/aquasec/trivy
    tag: 0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f # 0.72.0
