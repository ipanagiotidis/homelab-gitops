crds:
  migration:
    image:
      registry: reg.yiannis.io
      defaultRegistry: reg.yiannis.io
      repository: proxy-kyverno/kyverno/kyverno-cli
      tag: v1.19.1@sha256:ced7b2be0b04250cabfe695f15307f69eb715fe23234816388af4f3812915b2a

config:
  webhooks:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - kube-system
        - kyverno

  resourceFiltersExcludeNamespaces:
  - kyverno

features:
  # Explicitly preserve the existing 3.8.2 chart defaults during the upgrade.
  generateValidatingAdmissionPolicy:
    enabled: true
  validatingAdmissionPolicyReports:
    enabled: true
  policyReports:
    enabled: true
  backgroundScan:
    enabled: true
    backgroundScanInterval: 1h

test:
  image:
    registry: reg.yiannis.io
    repository: proxy-ghcr/kyverno/readiness-checker
    tag: v0.1.0@sha256:c54c0aa24d536f7a31ed854db4f2b2d6863b41d7d85725e21f80cd318c4e815b # v0.1.0

webhooksCleanup:
  image:
    registry: reg.yiannis.io
    repository: proxy-k8s/kubectl
    tag: v1.34.3@sha256:1c6309bd167feb49b2bc1605bce05973002872fd0d26a2e76499ed0c903ea3cf # v1.34.3

admissionController:
  initContainer:
    image:
      registry: reg.yiannis.io
      repository: proxy-kyverno/kyverno/kyvernopre
      tag: v1.19.1@sha256:c25c47461f06f2845a48c319ae86fbbc1730a7b9ed5b701889c9dc1f9ee94b09 # v1.19.1
  container:
    image:
      registry: reg.yiannis.io
      repository: proxy-kyverno/kyverno/kyverno
      tag: v1.19.1@sha256:b31d8511ae5fd6010e2a01ea72ebae08eb82fa51d91af14a1d9fe989949b4edb # v1.19.1
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 1m

backgroundController:
  image:
    registry: reg.yiannis.io
    repository: proxy-kyverno/kyverno/background-controller
    tag: v1.19.1@sha256:8f1e9143373a27578cafc2d28d2c66ba0926c63b4c77e63de8d2fdd4a122859f # v1.19.1
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 1m

cleanupController:
  image:
    registry: reg.yiannis.io
    repository: proxy-kyverno/kyverno/cleanup-controller
    tag: v1.19.1@sha256:67a48e62a8d8f8120c86914ff822b90017c54054c7b64ef8a1555645e9d9761e # v1.19.1
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 1m

reportsController:
  image:
    registry: reg.yiannis.io
    repository: proxy-kyverno/kyverno/reports-controller
    tag: v1.19.1@sha256:c0eee97b9b44a0dd35805d56b358fa52548480f79d4944602b9609538eccd64c # v1.19.1
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 1m
