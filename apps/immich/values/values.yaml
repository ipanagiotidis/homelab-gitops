defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

immich:
  metrics:
    enabled: true

  persistence:
    library:
      existingClaim: immich-library

server:
  controllers:
    main:
      containers:
        main:
          image:
            repository: reg.yiannis.io/proxy-ghcr/immich-app/immich-server
            # pinned to latest stable release tag: v3.1.0
            tag: v3.1.0
            digest: sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          env:
            DB_HOSTNAME: immich-database-rw
            DB_PORT: "5432"
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: username
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: dbname
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: password
  ingress:
    main:
      enabled: false
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/description: Immich
        gethomepage.dev/href: "https://photos.yiannis.io"
        gethomepage.dev/group: Media
        gethomepage.dev/icon: immich.png
        gethomepage.dev/name: Immich
        gethomepage.dev/pod-selector: ""
        gethomepage.dev/widget.type: "immich"
        gethomepage.dev/widget.url: "http://immich-server.immich.svc.cluster.local:2283"
        gethomepage.dev/widget.key: '{{`{{HOMEPAGE_VAR_IMMICH}}`}}'
        gethomepage.dev/widget.version: "2"
      hosts:
        - host: photos.yiannis.io
          paths:
            - path: /
              service:
                identifier: main
      tls: []

machine-learning:
  enabled: false
  controllers:
    main:
      containers:
        main:
          image:
            repository: reg.yiannis.io/proxy-ghcr/immich-app/immich-machine-learning
            tag: v3.1.0
            digest: sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: reg.yiannis.io/proxy-dockerhub/valkey/valkey
            tag: 9.1-alpine@sha256:355ae2c6c965769a0d9b9810711e6befd5b79fe676d1faa848247733ad6a4408
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      storageClass: truenas-apps
      accessMode: ReadWriteOnce
      size: 2Gi
