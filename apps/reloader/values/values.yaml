image:
  repository: reg.yiannis.io/proxy-ghcr/stakater/reloader
  tag: "v1.4.22@sha256:def2480040adc164b3a57340e77674eadfd88fb7f0593df25e93297f29c7fd7c"

reloader:
  autoReloadAll: false
  ignoreJobs: true
  ignoreCronJobs: true
  reloadStrategy: annotations
  logFormat: json
  logLevel: info
  watchGlobally: true
  readOnlyRootFileSystem: true
  deployment:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
