apiVersion: batch/v1
kind: Job
metadata:
  name: homelab-log-pipeline-test-20261022-01
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: homelab-log-pipeline-test
    app.kubernetes.io/instance: homelab-log-pipeline-test-20261022-01
spec:
  # Ordinary fixed-name resource: owner sync runs it once, then retains completion.
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 120
  # No TTL: retain completion so GitOps self-heal cannot recreate a deleted Job.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-log-pipeline-test
        app.kubernetes.io/instance: homelab-log-pipeline-test-20261022-01
        homelab.yiannis.io/test-run: "20261022-01"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: discovery-delay
          image: reg.yiannis.io/proxy-dockerhub/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          imagePullPolicy: IfNotPresent
          command: [/bin/busybox, sleep, "30"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: test-log-emitter
          # Reuse the official BusyBox pin from local-storage-provisioner.
          image: reg.yiannis.io/proxy-dockerhub/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          imagePullPolicy: IfNotPresent
          command: [/bin/busybox, printf]
          args:
            - '%s\n'
            - 'TEST homelab-log-pipeline run=20261022-01 synthetic=true no-auth-event=true'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi
        # Keep the pod discoverable while Alloy collects the emitter's stdout.
        - name: discovery-keepalive
          image: reg.yiannis.io/proxy-dockerhub/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          imagePullPolicy: IfNotPresent
          command: [/bin/busybox, sleep, "35"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi
