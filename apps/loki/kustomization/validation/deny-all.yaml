apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homelab-log-pipeline-test-deny-all
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homelab-log-pipeline-test
  ingressDeny:
    - fromEntities: [all]
  egressDeny:
    - toEntities: [all]
