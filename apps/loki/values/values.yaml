deploymentMode: Monolithic
loki:
  image:
    registry: reg.yiannis.io
    repository: proxy-dockerhub/grafana/loki
    tag: 3.7.8
    digest: sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: 'filesystem'
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 336h
  rulerConfig:
    storage:
      type: local
      local:
        directory: /etc/loki/security-rules
    rule_path: /tmp/loki-ruler
    evaluation_interval: 1m
    poll_interval: 1m
    enable_api: false
    enable_sharding: false
    enable_alertmanager_v2: true
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
  analytics:
    reporting_enabled: false
    usage_stats_url: ""
  schemaConfig:
    configs:
      - from: 2024-04-01
        object_store: filesystem
        store: tsdb
        schema: v13
        index:
          prefix: index_
          period: 24h
analytics:
  reporting_enabled: false
  usage_stats_url: ""
gateway:
  metrics:
    enabled: false
  image:
    registry: reg.yiannis.io
    repository: proxy-dockerhub/nginxinc/nginx-unprivileged
    tag: 1.31-alpine
    digest: sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00
singleBinary:
  replicas: 1
  extraVolumes:
    - name: security-rules
      configMap:
        name: loki-application-security-rules
        items:
          - key: application-security.yaml
            path: fake/application-security.yaml
  extraVolumeMounts:
    - name: security-rules
      mountPath: /etc/loki/security-rules
      readOnly: true
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 1Gi
  persistence:
    enabled: true
    size: 20Gi
    # Preserve the live claim template: the default StorageClass is used.
    storageClass: null
    accessModes:
    - ReadWriteOnce
monitoring:
  serviceMonitor:
    enabled: true
lokiCanary:
  enabled: false
test:
  enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
memcached:
  image:
    registry: reg.yiannis.io
    repository: proxy-dockerhub/library/memcached
    tag: 1.6.45-alpine@sha256:9e4de012dc607573052061c0bcb38abc775e1dd59b24e7ac38d1892842094aaf
memcachedExporter:
  image:
    registry: reg.yiannis.io
    repository: proxy-dockerhub/prom/memcached-exporter
    tag: v0.17.0@sha256:995c80e3ffbe6bc1a8e6a917c3a9f2075ad04dd16b86fac63c7eeb04e7c38f9b
resultsCache:
  allocatedMemory: 128
  allocatedCPU: 50m
sidecar:
  # Rules have one GitOps owner; no API-based ConfigMap/Secret discovery.
  rules:
    enabled: false
  image:
    registry: reg.yiannis.io
    repository: proxy-dockerhub/kiwigrid/k8s-sidecar
    tag: 2.14.1
    sha: 092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
