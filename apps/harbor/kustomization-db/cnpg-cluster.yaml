apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-database
  namespace: harbor
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:5efb66993894055f0aa50bd94337c6c4ff2e2129f4d433c527151aebbf283fb0

  storage:
    size: 8Gi
    storageClass: truenas-cnpg

  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: registry
      owner: harbor
      secret:
        name: harbor-cnpg-app
