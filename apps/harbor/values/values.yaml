expose:
  type: clusterIP
  tls:
    enabled: false
    certSource: none
  ingress:
    className: traefik
    hosts:
      core: reg.yiannis.io
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure

externalURL: https://reg.yiannis.io

nginx:
  # Recovery-critical registry components must not depend on Harbor itself.
  image:
    repository: docker.io/goharbor/nginx-photon
    tag: v2.15.4@sha256:7eff0287d5ad0f35754e162c8481ced04bbde107153ce586cefb15ee74fa1311
  replicas: 0

existingSecretAdminPassword: harbor-secrets
existingSecretSecretKey: harbor-secrets

persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      storageClass: truenas-apps
      size: 20Gi
    jobservice:
      jobLog:
        storageClass: local-path
        size: 1Gi
    redis:
      storageClass: local-path
      size: 1Gi
    trivy:
      storageClass: local-path
      size: 5Gi
  imageChartStorage:
    type: filesystem
    filesystem:
      rootdirectory: /storage

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 1m

portal:
  image:
    repository: docker.io/goharbor/harbor-portal
    tag: v2.15.4@sha256:01edf478505b21dba23a83c095f6ecac0c1e705690093edbab41e9a4d6754a75
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 192Mi

core:
  image:
    repository: docker.io/goharbor/harbor-core
    tag: v2.15.4@sha256:7d2ba5304a729887cdec7cb222a82b500278423de230ae5150c386a6c332b112
  existingSecret: harbor-secrets
  secretName: harbor-secrets
  existingXsrfSecret: harbor-secrets
  resources:
    requests:
      cpu: 75m
      memory: 192Mi
    limits:
      memory: 384Mi

jobservice:
  image:
    repository: docker.io/goharbor/harbor-jobservice
    tag: v2.15.4@sha256:f143578ef30e2be5c48873298257ed0fca31545025958c534e536a06765d2b82
  existingSecret: harbor-secrets
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      memory: 384Mi

registry:
  existingSecret: harbor-secrets
  registry:
    image:
      repository: docker.io/goharbor/registry-photon
      tag: v2.15.4@sha256:dc0cb388a6445c69c8a0c406679290d2991c9698833d9e6e86a23bdfaf2f83c3
    resources:
      requests:
        cpu: 75m
        memory: 192Mi
      limits:
        memory: 384Mi
  controller:
    image:
      repository: docker.io/goharbor/harbor-registryctl
      tag: v2.15.4@sha256:30bd1ace4e3bb390d75b84673f98ddb4a69fcc6d116932ea764391df01943fb7
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 192Mi
  credentials:
    existingSecret: harbor-secrets

trivy:
  image:
    repository: docker.io/goharbor/trivy-adapter-photon
    tag: v2.15.4@sha256:813ca81b4a4ea0f44f5fa81cca2645eeb58d4b1f6c66b428df9d506174bb71d9
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

database:
  type: external
  external:
    host: harbor-database-rw
    port: "5432"
    username: harbor
    coreDatabase: registry
    existingSecret: harbor-cnpg-app
    sslmode: disable

redis:
  internal:
    image:
      repository: docker.io/goharbor/valkey-photon
      tag: v2.15.4@sha256:bb022e8f236f56f53cee7bb1f609595e497da67d829048e0af2284f97e6eb54f
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

exporter:
  image:
    repository: docker.io/goharbor/harbor-exporter
    tag: v2.15.4@sha256:9ffede33dc519b4be035596a72f00f354754a22a3769077731f81ee7d6852f4f
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 96Mi
