apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-database
  namespace: gitea
spec:
  instances: 1

  imageName: reg.yiannis.io/proxy-ghcr/cloudnative-pg/postgresql:18.6-system-trixie@sha256:5efb66993894055f0aa50bd94337c6c4ff2e2129f4d433c527151aebbf283fb0

  storage:
    size: 10Gi
    storageClass: truenas-cnpg

  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: gitea
      owner: gitea
      secret:
        name: gitea-cnpg-app
