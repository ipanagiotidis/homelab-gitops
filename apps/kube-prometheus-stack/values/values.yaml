alertmanager:
  enabled: false
kubeApiServer:
  enabled: true
kubelet:
  enabled: true
kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false
# kubeEtcd:
#   enabled: false
kubeScheduler:
  enabled: false
# kube-proxy is still used, but its node:10249 metrics endpoint is not exposed.
kubeProxy:
  enabled: false
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
grafana:
  testFramework:
    enabled: false
  assertNoLeakedSecrets: false
  defaultDashboardsEnabled: false
  initChownData:
    enabled: false
  image:
    registry: reg.yiannis.io
    repository: proxy-dockerhub/grafana/grafana
    tag: "13.2.4"
    sha: "dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f"
  ingress:
    enabled: false
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/description: Grafana
      gethomepage.dev/href: "https://gfn.yiannis.io"
      gethomepage.dev/group: Monitoring
      gethomepage.dev/icon: grafana.png
      gethomepage.dev/name: grafana
      gethomepage.dev/pod-selector: ""
    hosts:
      - gfn.yiannis.io
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    auth:
      signout_redirect_url: "https://authentik.yiannis.io/application/o/grafana/end-session/"
      login_cookie_name: __Host-grafana_session
    server:
      domain: gfn.yiannis.io
      root_url: https://gfn.yiannis.io/
      enforce_domain: true
    security:
      cookie_secure: true
      cookie_samesite: strict
      login_cookie_name: __Host-grafana_session
      strict_transport_security: true
    auth.generic_oauth:
      name: authentik
      enabled: true
      auto_login: true
      client_id: $__file{/etc/secrets/auth_generic_oauth/GRAFANA_CLIENT_ID}
      client_secret: $__file{/etc/secrets/auth_generic_oauth/GRAFANA_CLIENT_SECRET}
      scopes: "openid profile email"
      auth_url: "https://authentik.yiannis.io/application/o/authorize/"
      token_url: "https://authentik.yiannis.io/application/o/token/"
      api_url: "https://authentik.yiannis.io/application/o/userinfo/"
      # Optionally map user groups to Grafana roles
      role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || contains(groups, 'Grafana Viewers') && 'Viewer'
    plugins:
      public_key_retrieval_disabled: true
      preinstall_disabled: true
      preinstall_auto_update: false
  extraSecretMounts:
    - name: auth-generic-oauth-secret-mount
      secretName: grafana-client
      defaultMode: 0440
      mountPath: /etc/secrets/auth_generic_oauth
      readOnly: true
  persistence:
    enabled: true
    type: pvc
    size: 10Gi  # Adjust the size according to your needs
    storageClassName: "local-path"  # Specify your storage class
    accessModes:
      - ReadWriteOnce
    finalizers:
      - kubernetes.io/pvc-protection
  resources:
    requests:
      cpu: 75m
      memory: 512Mi
  sidecar:
    image:
      registry: reg.yiannis.io
      repository: proxy-quay/kiwigrid/k8s-sidecar
      tag: 2.14.1@sha256:092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
    dashboards:
      enabled: true
      resource: configmap
      skipReload: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: k8s-sidecar-target-directory
      provider:
        foldersFromFilesStructure: true
        # Poll files instead of requiring Grafana server-admin credentials.
        updateIntervalSeconds: 30
    datasources:
      enabled: false
  # The chart checksums this file into the pod template. Changes cause a
  # controlled rollout and startup provisioning, without an admin API reload.
  datasources:
    datasources.yaml:
      apiVersion: 1
      deleteDatasources:
        - name: Alertmanager
          orgId: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://kube-prometheus-stack-prometheus.monitoring:9090/
          isDefault: true
          jsonData:
            httpMethod: POST
            timeInterval: 60s
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
        # Preserve the legacy name/UID for any UI-created dashboards. Both
        # definitions now have one provisioning owner; remove after UI audit.
        - name: loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          jsonData:
            maxLines: 500
