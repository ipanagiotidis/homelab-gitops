prometheus:
  serviceAccount:
    # Accepted chart >=90 behavior: a long-lived token for control-plane ServiceMonitors.
    createTokenSecret: true
  prometheusSpec:
    image:
      registry: reg.yiannis.io
      repository: proxy-quay/prometheus/prometheus
      tag: v3.15.0-distroless
      sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeInterval: "60s"
    evaluationInterval: "60s"
    enableRemoteWriteReceiver: false
    enableOTLPReceiver: false
    nodeSelector:
      extraDiskNode: "true"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi  # Sized for ~30d retention with headroom on current ingestion
          storageClassName: "local-path"  # Specify your storage class
    retention: "30d"
    retentionSize: "12GiB"
