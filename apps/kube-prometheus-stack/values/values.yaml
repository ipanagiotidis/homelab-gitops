alertmanager:
  enabled: false
kubeApiServer:
  enabled: true
kubelet:
  enabled: true
kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false
# kubeEtcd:
#   enabled: false
kubeScheduler:
  enabled: false
# kubeProxy:
#   enabled: false
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
grafana:
  assertNoLeakedSecrets: false
  defaultDashboardsEnabled: false
  initChownData:
    enabled: false
  image:
    registry: reg.yiannis.io
    repository: proxy-dockerhub/grafana/grafana
    # pinned to latest stable release tag: 13.1.0
    tag: 13.1.0
    sha: "121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63"
  ingress:
    enabled: false
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/description: Grafana
      gethomepage.dev/href: "https://gfn.yiannis.io"
      gethomepage.dev/group: Monitoring
      gethomepage.dev/icon: grafana.png
      gethomepage.dev/name: grafana
      gethomepage.dev/pod-selector: ""
    hosts:
      - gfn.yiannis.io
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    auth:
      signout_redirect_url: "https://authentik.yiannis.io/application/o/grafana/end-session/"
      login_cookie_name: __Host-grafana_session
    server:
      domain: gfn.yiannis.io
      root_url: https://gfn.yiannis.io/
      enforce_domain: true
    security:
      cookie_secure: true
      cookie_samesite: strict
      login_cookie_name: __Host-grafana_session
      strict_transport_security: true
    auth.generic_oauth:
      name: authentik
      enabled: true
      auto_login: true
      client_id: $__file{/etc/secrets/auth_generic_oauth/GRAFANA_CLIENT_ID}
      client_secret: $__file{/etc/secrets/auth_generic_oauth/GRAFANA_CLIENT_SECRET}
      scopes: "openid profile email"
      auth_url: "https://authentik.yiannis.io/application/o/authorize/"
      token_url: "https://authentik.yiannis.io/application/o/token/"
      api_url: "https://authentik.yiannis.io/application/o/userinfo/"
      # Optionally map user groups to Grafana roles
      role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || contains(groups, 'Grafana Viewers') && 'Viewer'
    plugins:
      public_key_retrieval_disabled: true
      preinstall_disabled: true
      preinstall_auto_update: false
  extraSecretMounts:
    - name: auth-generic-oauth-secret-mount
      secretName: grafana-client
      defaultMode: 0440
      mountPath: /etc/secrets/auth_generic_oauth
      readOnly: true
  persistence:
    enabled: true
    type: pvc
    size: 10Gi  # Adjust the size according to your needs
    storageClassName: "local-path"  # Specify your storage class
    accessModes:
      - ReadWriteOnce
    finalizers:
      - kubernetes.io/pvc-protection
  resources:
    requests:
      cpu: 75m
      memory: 512Mi
  sidecar:
    image:
      registry: reg.yiannis.io
      repository: proxy-quay/kiwigrid/k8s-sidecar
      tag: 2.8.1@sha256:abb55b2165c60e8f97e473862c7a3123df6f67d44f592949577c29b8fb2df9d6
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: k8s-sidecar-target-directory
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
kube-state-metrics:
  image:
    registry: reg.yiannis.io
    repository: proxy-k8s/kube-state-metrics/kube-state-metrics
    tag: v2.19.1
    sha: sha256:85108987d044b18a098126732f98602df408888c0f7d456241f5abefb9744bc1
prometheus-node-exporter:
  image:
    registry: reg.yiannis.io
    repository: proxy-quay/prometheus/node-exporter
    tag: v1.12.0
    digest: sha256:843ed23bb564f897ddcc6b6b9b605e398779487a561aae36fddd2933394836cd
prometheusOperator:
  image:
    registry: reg.yiannis.io
    repository: proxy-quay/prometheus-operator/prometheus-operator
    tag: v0.92.1
    sha: 7d9247d2351480fc74587e24681578f815f387bafb2ee7b86a852a94c4cd3774
  prometheusConfigReloader:
    image:
      registry: reg.yiannis.io
      repository: proxy-quay/prometheus-operator/prometheus-config-reloader
      tag: v0.92.1
      sha: 74550ba3e8bf93f47bc574231090d340ae9c01d25cd11ff74799e65f9fdb9a48
  admissionWebhooks:
    patch:
      image:
        registry: reg.yiannis.io
        repository: proxy-ghcr/jkroepke/kube-webhook-certgen
        tag: 1.8.4
        sha: 76a2170cd0c9a7758c4ac8ac5bbe9b6f73e869a15ffb77d9f684664f7d7b96b1
prometheus:
  prometheusSpec:
    image:
      registry: reg.yiannis.io
      repository: proxy-quay/prometheus/prometheus
      tag: v3.13.1-distroless
      sha: 214f8427c8fba80c327bb94a75feb802ae12f2d6ca30812aa6e7d22f09bbea80
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeInterval: "60s"
    evaluationInterval: "60s"
    enableRemoteWriteReceiver: false
    enableOTLPReceiver: false
    nodeSelector:
      extraDiskNode: "true"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi  # Sized for ~30d retention with headroom on current ingestion
          storageClassName: "local-path"  # Specify your storage class
    retention: "30d"
    retentionSize: "12GiB"
