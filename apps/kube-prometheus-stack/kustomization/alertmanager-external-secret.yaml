apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secret-alertmanager
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: alertmanager-notification-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: pushover-user-key
      remoteRef:
        key: ALERTMANAGER_PUSHOVER_USER_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: pushover-api-token
      remoteRef:
        key: ALERTMANAGER_PUSHOVER_API_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: healthchecks-url
      remoteRef:
        key: ALERTMANAGER_HEALTHCHECKS_URL
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
