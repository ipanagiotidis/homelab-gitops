rbac:
  create: true

# CRDs are managed by this Application's explicit Kustomize source.
crds:
  enabled: false

admissionController:
  enabled: false

recommender:
  replicas: 1
  image:
    repository: reg.yiannis.io/proxy-k8s/autoscaling/vpa-recommender
    tag: "1.8.0@sha256:e743e3a7e58a614f850063dba5df88eec5a19cf4cc43edb2050248df2d7dd8d3"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 256Mi

updater:
  enabled: false
