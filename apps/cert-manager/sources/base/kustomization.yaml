apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Keep aligned with the controller/chart version, not a separate upgrade track.
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.crds.yaml
  - ./resources/clusterissuer.yaml
  - ./resources/external-secret.yaml
  - ./resources/truenas-certificate.yaml

patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: unused
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
          argocd.argoproj.io/sync-options: ServerSideApply=true,Replace=false,Prune=false,Delete=false
