apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: crowdsec-root-issuer
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: crowdsec-ca
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  isCA: true
  commonName: crowdsec-ca
  secretName: crowdsec-root-secret
  duration: 87600h # 10y
  renewBefore: 8760h # 1y
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: crowdsec-root-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: crowdsec-ca-issuer
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ca:
    secretName: crowdsec-root-secret
