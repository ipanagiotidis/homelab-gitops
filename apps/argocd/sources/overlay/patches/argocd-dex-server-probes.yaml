apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
spec:
  template:
    spec:
      containers:
      - name: dex
        startupProbe:
          tcpSocket:
            port: 5556
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 5556
          failureThreshold: 3
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 5556
          failureThreshold: 3
          periodSeconds: 30
