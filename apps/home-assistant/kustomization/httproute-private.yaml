apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-private
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Home Assistant
    gethomepage.dev/description: Home observability
    gethomepage.dev/group: Services
    gethomepage.dev/icon: home-assistant.png
    gethomepage.dev/href: https://home.yiannis.io
spec:
  parentRefs:
    - name: private
      namespace: traefik
      sectionName: websecure-home
  hostnames:
    - home.yiannis.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Native HA authentication and OIDC; no second ForwardAuth gate.
      backendRefs:
        - name: home-assistant
          port: 8123
