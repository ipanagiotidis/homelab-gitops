apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: home-assistant-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: oidc-client-id
      remoteRef:
        key: HOME_ASSISTANT_OIDC_CLIENT_ID
    - secretKey: oidc-client-secret
      remoteRef:
        key: HOME_ASSISTANT_OIDC_CLIENT_SECRET
    - secretKey: mqtt-ha-password
      remoteRef:
        key: HOME_ASSISTANT_MQTT_PASSWORD
    - secretKey: mqtt-zigbee-password
      remoteRef:
        key: ZIGBEE2MQTT_MQTT_PASSWORD
