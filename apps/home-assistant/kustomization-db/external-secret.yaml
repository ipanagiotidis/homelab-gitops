apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-cnpg-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: home-assistant-cnpg-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: homeassistant
        password: "{{ .password }}"
        db-url: 'postgresql://homeassistant:{{ .password | urlquery | replace "+" "%20" }}@home-assistant-database-rw.home-assistant.svc.cluster.local:5432/homeassistant?sslmode=verify-full&sslrootcert=/database-ca/ca.crt'
  data:
    - secretKey: password
      remoteRef:
        key: HOME_ASSISTANT_POSTGRES_PASSWORD
