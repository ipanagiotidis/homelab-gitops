apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-assistant-database
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: reg.yiannis.io/proxy-ghcr/cloudnative-pg/postgresql:18.6-system-trixie@sha256:5efb66993894055f0aa50bd94337c6c4ff2e2129f4d433c527151aebbf283fb0
  storage:
    size: 10Gi
    storageClass: truenas-cnpg
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: homeassistant
      owner: homeassistant
      secret:
        name: home-assistant-cnpg-app
