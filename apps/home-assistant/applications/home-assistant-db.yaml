# Prepared only: registration in the root Kustomization is paused until hardware arrives.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant-db
  namespace: argocd
  labels:
    app: home-assistant-db
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  destination:
    namespace: home-assistant
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/ipanagiotidis/homelab-gitops.git
    targetRevision: master
    path: apps/home-assistant/kustomization-db
  syncPolicy:
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
