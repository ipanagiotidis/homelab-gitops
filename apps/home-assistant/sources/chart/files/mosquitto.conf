listener 8883 0.0.0.0
allow_anonymous false
password_file /auth/passwords
acl_file /etc/mqtt/acl
certfile /tls/tls.crt
keyfile /tls/tls.key
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
log_dest stdout
log_type error
log_type warning
connection_messages false
