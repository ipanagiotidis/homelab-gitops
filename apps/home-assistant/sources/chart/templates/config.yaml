apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
data:
  configuration.yaml: |
{{ .Files.Get "files/configuration.yaml" | indent 4 }}
  observability.yaml: |
{{ .Files.Get "files/observability.yaml" | indent 4 }}
  install_plugin.py: |
{{ .Files.Get "files/install_plugin.py" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-sso
binaryData:
  plugin.zip: {{ .Files.Get "files/vendor/hass-oidc-auth-v1.2.1.zip" | b64enc | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-mqtt-config
data:
  mosquitto.conf: |
{{ .Files.Get "files/mosquitto.conf" | indent 4 }}
  acl: |
{{ .Files.Get "files/mosquitto.acl" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-zigbee-config
data:
  configuration.yaml: |
{{ .Files.Get "files/zigbee2mqtt.yaml" | indent 4 }}
