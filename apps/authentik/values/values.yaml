global:  
  nodeSelector:
    extraDiskNode: "true"
  image:
    repository: reg.yiannis.io/proxy-ghcr/goauthentik/server
    tag: 2026.8.4
    digest: sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c
  env:
    # Traefik connects from the pod CIDR; CNPs restrict allowed callers.
    - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
      value: "127.0.0.1/32,::1/128,10.245.0.0/16"

authentik:
  secret_key: "PleaseGenerateA50CharKey"
  # This sends anonymous usage-data, stack traces on errors and
  # performance data to sentry.io, and is fully opt-in
  error_reporting:
    enabled: false
  postgresql:
    host: authentik-database-rw.authentik.svc.cluster.local
    name: authentik
    user: authentik
    password: file:///postgres-creds/AUTHENTIK_POSTGRES_PASSWORD
  log_level: "info"

server:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  resources:
    requests:
      cpu: 75m
      memory: 896Mi
  ingress:
    # Specify kubernetes ingress controller class name
    ingressClassName: traefik
    enabled: false
    hosts:
      # Specify external host name
      - authentik.yiannis.io
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/description: Authentik
      gethomepage.dev/href: "https://authentik.yiannis.io"
      gethomepage.dev/group: Platform
      gethomepage.dev/icon: authentik.png
      gethomepage.dev/name: authentik
      gethomepage.dev/pod-selector: ""
      gethomepage.dev/widget.type: "authentik"
      gethomepage.dev/widget.version: "2"
      gethomepage.dev/widget.url: "http://authentik-server.authentik.svc.cluster.local"
      gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_AUTHENTIK}}"
  volumes:
    - name: postgres-creds
      secret:
        secretName: authentik-postgres-credentials
  volumeMounts:
    - name: postgres-creds
      mountPath: /postgres-creds
      readOnly: true
  envFrom:
  - secretRef:
      name: authentik-secret-key

postgresql:
  enabled: false
  image:
    tag: 15
  volumePermissions:
    enabled: true
    image:
      registry: reg.yiannis.io
      repository: proxy-dockerhub/bitnamilegacy/os-shell
      tag: 12-debian-12-r50
      pullPolicy: IfNotPresent
  auth:
    existingSecret: authentik-postgres-credentials
    secretKeys:
      adminPasswordKey: AUTHENTIK_POSTGRES_ADMIN_PASSWORD
      userPasswordKey: AUTHENTIK_POSTGRES_PASSWORD
  primary:
    nodeSelector:
      extraDiskNode: "true"

redis:
  enabled: true
  volumePermissions:
    enabled: true
    image:
      registry: reg.yiannis.io
      repository: proxy-dockerhub/bitnamilegacy/os-shell
      tag: 12-debian-12-r50
      pullPolicy: IfNotPresent
  master:
    nodeSelector:
      extraDiskNode: "true"

worker:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  resources:
    requests:
      cpu: 100m
      memory: 704Mi
  volumes:
    - name: postgres-creds
      secret:
        secretName: authentik-postgres-credentials
  volumeMounts:
    - name: postgres-creds
      mountPath: /postgres-creds
      readOnly: true
  envFrom:
  - secretRef:
      name: authentik-secret-key
