apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secret-database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: authentik-postgres-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Match the key used by authentik-cnpg-app; bundled PostgreSQL is disabled.
    - secretKey: AUTHENTIK_POSTGRES_PASSWORD
      remoteRef:
        key: AUTHENTIK_POSTGRES_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
